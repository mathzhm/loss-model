<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础分布 → 对应的 GEV 类型交互表 (DoA 直觉)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --highlight-color: #e74c3c;
            --bg-color: #f5f7fa;
            --panel-bg: #ffffff;
            --text-color: #333;
            --weibull-color: #2ecc71;
            --gumbel-color: #f39c12;
            --frechet-color: #e74c3c;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-top: 0; color: var(--primary-color); margin-bottom: 30px; }
        
        .container {
            max-width: 1200px;
            width: 100%;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .input-section {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background-color: #e8f4fd;
            border-radius: 8px;
            border: 1px solid #b3d7f2;
        }

        select {
            padding: 10px 20px;
            font-size: 1.1em;
            border-radius: 6px;
            border: 2px solid var(--accent-color);
            background-color: white;
            cursor: pointer;
            margin-left: 10px;
            outline: none;
        }

        .visualization-area {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 20px;
            margin-bottom: 30px;
        }

        .source-dist {
            flex: 1;
            text-align: center;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .arrow-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100px;
            color: #7f8c8d;
            font-weight: bold;
        }

        .arrow {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .target-gev {
            flex: 2;
            display: flex;
            gap: 15px;
        }

        .gev-card {
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            opacity: 0.5;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .gev-card h3 { margin: 0 0 10px 0; }
        .gev-card p { font-size: 0.9em; margin: 0; }

        .gev-card.weibull-type { border-color: var(--weibull-color); color: var(--weibull-color); }
        .gev-card.gumbel-type { border-color: var(--gumbel-color); color: var(--gumbel-color); }
        .gev-card.frechet-type { border-color: var(--frechet-color); color: var(--frechet-color); }

        .gev-card.active {
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            background-color: #fff;
        }
        
        .gev-card.active.weibull-type { background-color: #eafaf1; }
        .gev-card.active.gumbel-type { background-color: #fef5e6; }
        .gev-card.active.frechet-type { background-color: #fdedec; }

        .explanation-box {
            background-color: #f8f9fa;
            border-left: 5px solid var(--primary-color);
            padding: 20px;
            border-radius: 4px;
            margin-top: 20px;
        }

        .explanation-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
            display: block;
        }

        canvas {
            border: 1px solid #eee;
            background-color: #fff;
            margin-top: 15px;
        }

    </style>
</head>
<body>

    <h1>基础分布 → 对应的 GEV 类型交互表 (DoA 直觉)</h1>

    <div class="container">
        <!-- Input -->
        <div class="input-section">
            <label for="dist-select" style="font-weight: bold; font-size: 1.2em;">选择基础分布 (Underlying Distribution):</label>
            <select id="dist-select" onchange="updateView()">
                <option value="" disabled selected>-- 请选择 --</option>
                <optgroup label="有界分布 (Bounded)">
                    <option value="uniform">Uniform (均匀分布)</option>
                    <option value="beta">Beta (贝塔分布)</option>
                </optgroup>
                <optgroup label="轻尾/指数尾 (Light Tailed)">
                    <option value="normal">Normal (正态分布)</option>
                    <option value="exponential">Exponential (指数分布)</option>
                    <option value="gamma">Gamma (伽马分布)</option>
                    <option value="weibull_dist">Weibull (韦伯分布)</option>
                    <option value="lognormal">Lognormal (对数正态分布)</option>
                </optgroup>
                <optgroup label="重尾/多项式尾 (Heavy Tailed)">
                    <option value="pareto">Pareto (帕累托分布)</option>
                    <option value="burr">Burr (伯尔分布)</option>
                    <option value="t_dist">t-distribution (t分布)</option>
                    <option value="cauchy">Cauchy (柯西分布)</option>
                </optgroup>
            </select>
        </div>

        <!-- Visualization -->
        <div class="visualization-area">
            <!-- Source -->
            <div class="source-dist">
                <h3>基础分布示意图</h3>
                <canvas id="sourceCanvas" width="250" height="150"></canvas>
                <p id="tail-desc" style="margin-top: 10px; font-weight: bold; color: #666;">--</p>
            </div>

            <!-- Arrow -->
            <div class="arrow-container">
                <div class="arrow">➜</div>
                <div>属于最大吸引域</div>
                <div>(MDA)</div>
            </div>

            <!-- Target -->
            <div class="target-gev">
                <div class="gev-card weibull-type" id="card-weibull">
                    <h3>Weibull 类型</h3>
                    <p>参数 &xi; < 0</p>
                    <p>有限上界 (Finite Upper Bound)</p>
                </div>
                <div class="gev-card gumbel-type" id="card-gumbel">
                    <h3>Gumbel 类型</h3>
                    <p>参数 &xi; = 0</p>
                    <p>指数级衰减 (Light Tail)</p>
                    <p>无上界</p>
                </div>
                <div class="gev-card frechet-type" id="card-frechet">
                    <h3>Fréchet 类型</h3>
                    <p>参数 &xi; > 0</p>
                    <p>多项式衰减 (Heavy Tail)</p>
                    <p>极厚尾</p>
                </div>
            </div>
        </div>

        <!-- Explanation -->
        <div class="explanation-box" id="explanation" style="display: none;">
            <span class="explanation-title">DoA 判定解析：</span>
            <p id="explanation-text">请选择一个分布以查看详细解析。</p>
        </div>
    </div>

    <script>
        const distData = {
            'uniform': {
                type: 'weibull',
                tail: '有限上界 (Finite)',
                desc: 'Uniform 分布定义在 [a, b] 区间内，其概率密度在 b 处突然截断为 0。这种具有确定的有限上界（Right Endpoint Finite）的分布，其最大值收敛于 Weibull 类型（通常对应 &xi; < 0 的 GEV）。',
                draw: (ctx, w, h) => {
                    ctx.beginPath();
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    ctx.moveTo(20, h-20);
                    ctx.lineTo(20, 50);
                    ctx.lineTo(w-20, 50);
                    ctx.lineTo(w-20, h-20);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.2)';
                    ctx.fill();
                    // Text
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = '12px Arial';
                    ctx.fillText('Finite Bound', w-80, 40);
                }
            },
            'beta': {
                type: 'weibull',
                tail: '有限上界 (Finite)',
                desc: 'Beta 分布通常定义在 [0, 1] 区间内。因为存在固定的最大值上界，其极值分布属于 Weibull 吸引域。',
                draw: (ctx, w, h) => {
                    ctx.beginPath();
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    ctx.moveTo(20, h-20);
                    // Bell shape but bounded
                    for(let x=20; x<=w-20; x++) {
                        let relX = (x-20)/(w-40); // 0 to 1
                        let y = Math.pow(relX, 2) * Math.pow(1-relX, 2) * 1000; // simple beta shape
                        ctx.lineTo(x, h-20-y);
                    }
                    ctx.lineTo(w-20, h-20);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.2)';
                    ctx.fill();
                }
            },
            'normal': {
                type: 'gumbel',
                tail: '极快衰减 (Light)',
                desc: '正态分布的尾部衰减速度非常快（exp(-x²)），比指数分布还快。属于典型的轻尾分布，其极值收敛于 Gumbel 类型。',
                draw: (ctx, w, h) => {
                    drawBellCurve(ctx, w, h);
                }
            },
            'exponential': {
                type: 'gumbel',
                tail: '指数衰减 (Exponential)',
                desc: '指数分布是 Gumbel 吸引域的代表。其尾部以 exp(-x) 的速度衰减，是判定轻尾与重尾的基准线。',
                draw: (ctx, w, h) => {
                    ctx.beginPath();
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    ctx.moveTo(20, 20);
                    for(let x=20; x<w; x++) {
                        let relX = (x-20)/50; 
                        let y = Math.exp(-relX) * 100;
                        ctx.lineTo(x, h-20-y);
                    }
                    ctx.stroke();
                }
            },
            'gamma': {
                type: 'gumbel',
                tail: '指数衰减 (Light)',
                desc: 'Gamma 分布的尾部表现类似于指数分布（包含 exp(-x) 项），因此也属于 Gumbel 吸引域。',
                draw: (ctx, w, h) => {
                    // Similar to exp but starts at 0
                     ctx.beginPath();
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    ctx.moveTo(20, h-20);
                    for(let x=20; x<w; x++) {
                        let relX = (x-20)/30; 
                        let y = Math.pow(relX, 2) * Math.exp(-relX) * 50;
                        ctx.lineTo(x, h-20-y);
                    }
                    ctx.stroke();
                }
            },
            'weibull_dist': {
                type: 'gumbel',
                tail: '指数衰减 (Light)',
                desc: '注意区分：这里指作为基础分布的 Weibull 分布。当其形状参数使得尾部呈指数级衰减时（常见情况），它属于 Gumbel 吸引域。只有反向 Weibull 才有有限上界。',
                draw: (ctx, w, h) => {
                     ctx.beginPath();
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    ctx.moveTo(20, h-20);
                    for(let x=20; x<w; x++) {
                        let relX = (x-20)/40; 
                        let y = relX * Math.exp(-Math.pow(relX, 1.5)) * 80;
                        ctx.lineTo(x, h-20-y);
                    }
                    ctx.stroke();
                }
            },
            'lognormal': {
                type: 'gumbel',
                tail: '中等偏重 (Semi-Heavy)',
                desc: 'Lognormal 经常被误认为是重尾（因为它比 Exponential 衰减慢），但在极值理论中，它的所有矩都存在，尾部衰减速度仍足够快，归类于 Gumbel 吸引域（尽管非常接近 Fréchet 的边界）。',
                draw: (ctx, w, h) => {
                    // Asymmetric bell
                    ctx.beginPath();
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    ctx.moveTo(20, h-20);
                    for(let x=21; x<w; x++) {
                        let relX = (x-20)/40; 
                        // Simplified lognormal shape logic
                        let y = (1/relX) * Math.exp(-Math.pow(Math.log(relX), 2)) * 40;
                        if(y>120) y=120;
                        if(relX<=0) y=0;
                        ctx.lineTo(x, h-20-y);
                    }
                    ctx.stroke();
                }
            },
            'pareto': {
                type: 'frechet',
                tail: '多项式衰减 (Heavy)',
                desc: 'Pareto 分布是重尾分布的典型代表。其尾部服从幂律衰减（Polynomial Decay, x^-a），衰减速度慢，极值可能非常大，因此属于 Fréchet 吸引域。',
                draw: (ctx, w, h) => {
                    ctx.beginPath();
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    // Starts high drops slow
                    let startX = 20;
                    ctx.moveTo(startX, 20); 
                    for(let x=startX; x<w; x++) {
                        let relX = (x-startX + 10)/20; 
                        let y = (1/Math.pow(relX, 1.5)) * 100;
                        if(y > h-40) y = h-40;
                        ctx.lineTo(x, h-20-y);
                    }
                    ctx.stroke();
                }
            },
            'burr': {
                type: 'frechet',
                tail: '多项式衰减 (Heavy)',
                desc: 'Burr 分布也是典型的重尾分布，常用于保险精算。其尾部同样表现为幂律特征，属于 Fréchet 吸引域。',
                draw: (ctx, w, h) => {
                    ctx.beginPath();
                    ctx.strokeStyle = '#2c3e50';
                    ctx.lineWidth = 2;
                    ctx.moveTo(20, h-20); 
                    for(let x=21; x<w; x++) {
                        let relX = (x-20)/30; 
                        // Simplified heavy tail shape
                        let y = relX / Math.pow(1+relX, 3) * 150;
                        ctx.lineTo(x, h-20-y);
                    }
                    ctx.stroke();
                }
            },
            't_dist': {
                type: 'frechet',
                tail: '多项式衰减 (Heavy)',
                desc: '学生 t-分布虽然看起来像正态分布，但其尾部更厚（多项式衰减）。自由度越小，尾越厚。属于 Fréchet 吸引域。',
                draw: (ctx, w, h) => {
                    drawBellCurve(ctx, w, h, true); // fatter tail
                }
            },
            'cauchy': {
                type: 'frechet',
                tail: '极重尾 (Very Heavy)',
                desc: '柯西分布的尾部极厚（矩不存在）。它是 t-分布自由度为 1 的特例，衰减非常慢，属于 Fréchet 吸引域。',
                draw: (ctx, w, h) => {
                     drawBellCurve(ctx, w, h, true); 
                }
            }
        };

        function drawBellCurve(ctx, w, h, fatTail = false) {
            ctx.beginPath();
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 2;
            let center = w/2;
            ctx.moveTo(0, h-20);
            for(let x=0; x<=w; x++) {
                let relX = (x-center)/30;
                let y = 0;
                if(fatTail) {
                    y = (1 / (1 + relX*relX)) * 100; // Cauchy-like
                } else {
                    y = Math.exp(-relX*relX/2) * 100; // Normal
                }
                ctx.lineTo(x, h-20-y);
            }
            ctx.stroke();
        }

        function updateView() {
            const select = document.getElementById('dist-select');
            const val = select.value;
            if(!val) return;

            const data = distData[val];
            
            // 1. Highlight Cards
            document.querySelectorAll('.gev-card').forEach(el => el.classList.remove('active'));
            const targetCard = document.getElementById(`card-${data.type}`);
            if(targetCard) targetCard.classList.add('active');

            // 2. Update Canvas
            const canvas = document.getElementById('sourceCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw axis
            ctx.beginPath();
            ctx.strokeStyle = '#ddd';
            ctx.moveTo(10, canvas.height-20);
            ctx.lineTo(canvas.width-10, canvas.height-20); // x-axis
            ctx.stroke();

            // Draw shape
            if(data.draw) {
                data.draw(ctx, canvas.width, canvas.height);
            }

            // 3. Update Text
            document.getElementById('tail-desc').textContent = `尾部特征: ${data.tail}`;
            
            const explanationBox = document.getElementById('explanation');
            explanationBox.style.display = 'block';
            document.getElementById('explanation-text').innerHTML = `
                <strong>${select.options[select.selectedIndex].text}</strong>:<br>
                ${data.desc}
            `;
        }
    </script>
</body>
</html>
