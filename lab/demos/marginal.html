<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固定边缘分布 + 换 Copula 看聚合损失/资本影响</title>
    <style>
        :root {
            --primary-color: #8e44ad;
            --accent-color: #f39c12;
            --bg-color: #f4f6f7;
            --panel-bg: #ffffff;
            --text-color: #2c3e50;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-top: 0; color: var(--primary-color); }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
        }

        .control-panel {
            flex: 1;
            min-width: 320px;
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .charts-panel {
            flex: 2;
            min-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-container {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        .section-title {
            font-size: 1.1em;
            font-weight: bold;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
            color: var(--primary-color);
            margin-top: 20px;
        }
        .section-title:first-child { margin-top: 0; }

        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; }
        select, input[type="range"] { width: 100%; padding: 8px; box-sizing: border-box; }
        
        .value-display { text-align: right; font-size: 0.85em; color: #666; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            border-left: 4px solid var(--accent-color);
        }
        .stat-val { font-size: 1.6em; font-weight: bold; color: var(--primary-color); margin: 5px 0; }
        .stat-label { font-size: 0.9em; color: #7f8c8d; }

        .highlight-box {
            background: #fff8e1;
            border: 1px solid #ffe0b2;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            line-height: 1.5;
            color: #d35400;
        }

        canvas { width: 100%; height: 400px; background: #fff; }

    </style>
</head>
<body>

    <h1>固定边缘分布 + 换 Copula 看聚合损失/资本影响</h1>

    <div class="container">
        <!-- Control Panel -->
        <div class="control-panel">
            
            <div class="section-title">1. 边缘分布 (Marginal Distributions)</div>
            <div class="highlight-box" style="margin-bottom:15px; font-size:0.85em; color:#555; background:#eee; border-color:#ddd;">
                边缘分布类型固定后，可调整参数。观察仅改变 Copula 对结果的影响。
            </div>
            
            <!-- Loss X -->
            <div class="control-group">
                <label>Loss X Distribution</label>
                <select id="dist_x" onchange="updateDistUI('x'); updateSim();">
                    <option value="lnorm">Lognormal (对数正态)</option>
                    <option value="pareto">Pareto (帕累托)</option>
                    <option value="exp">Exponential (指数)</option>
                </select>
                <div id="params_x" style="margin-top: 10px; padding-left: 10px; border-left: 2px solid #eee;"></div>
            </div>

            <!-- Loss Y -->
            <div class="control-group">
                <label>Loss Y Distribution</label>
                <select id="dist_y" onchange="updateDistUI('y'); updateSim();">
                    <option value="lnorm">Lognormal (对数正态)</option>
                    <option value="pareto">Pareto (帕累托)</option>
                    <option value="exp">Exponential (指数)</option>
                </select>
                <div id="params_y" style="margin-top: 10px; padding-left: 10px; border-left: 2px solid #eee;"></div>
            </div>

            <div class="section-title">2. Copula (依赖结构)</div>
            <div class="control-group">
                <label>Type</label>
                <select id="copulaType" onchange="updateCopulaUI()">
                    <option value="gumbel">Gumbel (上尾依赖 - 巨灾共振)</option>
                    <option value="clayton">Clayton (下尾依赖)</option>
                    <option value="frank">Frank (无尾部依赖)</option>
                    <option value="gaussian">Gaussian (无尾部依赖)</option>
                    <option value="t">Student's t (双尾依赖)</option>
                    <option value="indep">Independence (独立)</option>
                </select>
            </div>
            <div id="copulaParams"></div>

            <div class="section-title">3. 聚合方式 (Aggregation)</div>
            <div class="control-group">
                <label>Function S</label>
                <select id="aggFunc" onchange="updateSim()">
                    <option value="sum">Sum (S = X + Y)</option>
                    <option value="max">Max (S = max(X, Y))</option>
                </select>
            </div>

            <div class="highlight-box">
                注意观察：当使用 <b>Gumbel</b> 或 <b>t-Copula</b> 时，VaR/TVaR 通常会显著上升，因为极端大损失往往同时发生。
            </div>
        </div>

        <!-- Charts Panel -->
        <div class="charts-panel">
            <!-- Key Metrics -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">99% VaR (Value at Risk)</div>
                    <div class="stat-val" id="val_var">0.00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">99% TVaR (Tail VaR)</div>
                    <div class="stat-val" id="val_tvar">0.00</div>
                </div>
            </div>

            <!-- Histogram -->
            <div class="chart-container">
                <canvas id="histCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- Utils ---
        function stdNormalCDF(x) {
            var t = 1 / (1 + 0.2316419 * Math.abs(x));
            var d = 0.3989423 * Math.exp(-x * x / 2);
            var prob = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
            if (x > 0) prob = 1 - prob;
            return prob;
        }
        function invNormalCDF(p) {
            if (p <= 0) return -8; if (p >= 1) return 8;
            var a1 = -3.969683028665376e+01, a2 = 2.209460984245205e+02, a3 = -2.759285104469687e+02, a4 = 1.383577518672690e+02, a5 = -3.066479806614716e+01, a6 = 2.506628277459239e+00;
            var b1 = -5.447609879822406e+01, b2 = 1.615858368580409e+02, b3 = -1.556989798598866e+02, b4 = 6.680131188771972e+01, b5 = -1.328068155288572e+01;
            var c1 = -7.784894002430293e-03, c2 = -3.223964580411365e-01, c3 = -2.400758277161838e+00, c4 = -2.549732539343734e+00, c5 = 4.374664141464968e+00, c6 = 2.938163982698783e+00;
            var d1 = 7.784695709041462e-03, d2 = 3.224671290700398e-01, d3 = 2.445134137142996e+00, d4 = 3.754408661907416e+00;
            var q, t, x;
            if (p < 0.02425) { q = Math.sqrt(-2 * Math.log(p)); x = (((((c1 * q + c2) * q + c3) * q + c4) * q + c5) * q + c6) / ((((d1 * q + d2) * q + d3) * q + d4) * q + 1); }
            else if (p > 1 - 0.02425) { q = Math.sqrt(-2 * Math.log(1 - p)); x = -(((((c1 * q + c2) * q + c3) * q + c4) * q + c5) * q + c6) / ((((d1 * q + d2) * q + d3) * q + d4) * q + 1); }
            else { q = p - 0.5; let r = q * q; x = (((((a1 * r + a2) * r + a3) * r + a4) * r + a5) * r + a6) * q / (((((b1 * r + b2) * r + b3) * r + b4) * r + b5) * r + 1); }
            return x;
        }
        function randn() {
            let u = 0, v = 0;
            while(u === 0) u = Math.random();
            while(v === 0) v = Math.random();
            return Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
        }
        function randGamma(k) {
            if (k < 1) return randGamma(1 + k) * Math.pow(Math.random(), 1 / k);
            let d = k - 1 / 3, c = 1 / Math.sqrt(9 * d);
            while (true) {
                let x = randn(), v = 1 + c * x;
                while (v <= 0) { x = randn(); v = 1 + c * x; }
                v = v * v * v; let u = Math.random();
                if (u < 1 - 0.0331 * x * x * x * x) return d * v;
                if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v;
            }
        }
        function randStable(alpha) {
            let theta = (Math.random() - 0.5) * Math.PI;
            let w = -Math.log(Math.random());
            let num = Math.sin(alpha * (theta + Math.PI/2));
            let den = Math.pow(Math.cos(theta), 1/alpha);
            return (num / den) * Math.pow(Math.cos(theta - alpha * (theta + Math.PI/2)) / w, (1-alpha)/alpha);
        }

        // --- Distributions Config ---
        const Distributions = {
            lnorm: {
                params: [
                    {id: 'mu', label: 'Mu (μ)', val: 4.0, step: 0.1, min: 0, max: 10},
                    {id: 'sigma', label: 'Sigma (σ)', val: 1.0, step: 0.1, min: 0.1, max: 5}
                ]
            },
            pareto: {
                params: [
                    {id: 'alpha', label: 'Alpha (α)', val: 2.0, step: 0.1, min: 0.5, max: 10},
                    {id: 'theta', label: 'Theta (θ)', val: 100, step: 10, min: 10, max: 1000}
                ]
            },
            exp: {
                params: [
                    {id: 'mean', label: 'Mean', val: 100, step: 10, min: 10, max: 1000}
                ]
            }
        };

        // --- Inverse CDFs ---
        function invCDF(dist, p, params) {
            // p in [0,1]
            if(p >= 1) p = 0.9999999;
            if(p <= 0) p = 0.0000001;
            
            switch(dist) {
                case 'lnorm':
                    return Math.exp(parseFloat(params.mu) + parseFloat(params.sigma) * invNormalCDF(p));
                case 'pareto': 
                    // Pareto I: F(x) = 1 - (theta/x)^alpha for x >= theta
                    // x = theta / (1-p)^(1/alpha)
                    let alpha = parseFloat(params.alpha);
                    let theta = parseFloat(params.theta);
                    return theta / Math.pow(1-p, 1/alpha);
                case 'exp': 
                    // x = -mean * ln(1-p)
                    let mean = parseFloat(params.mean);
                    return -mean * Math.log(1-p);
                default: return 0;
            }
        }

        // --- Copula Gen ---
        const Copulas = {
            gumbel: {
                params: [{id: 'alpha', min: 1.1, max: 10, step: 0.1, val: 2.0}],
                gen: (m, p) => {
                    let a = parseFloat(p.alpha);
                    let invA = 1/a;
                    let cosPart = Math.cos(Math.PI * invA / 2);
                    let scale = Math.pow(cosPart, 1/invA);
                    let data = [];
                    for(let i=0; i<m; i++) {
                        let S = randStable(invA) * scale;
                        let u = Math.exp(-Math.pow(-Math.log(Math.random())/S, invA));
                        let v = Math.exp(-Math.pow(-Math.log(Math.random())/S, invA));
                        data.push({u, v});
                    }
                    return data;
                }
            },
            clayton: {
                params: [{id: 'alpha', min: 0.1, max: 10, step: 0.1, val: 2.0}],
                gen: (m, p) => {
                    let a = parseFloat(p.alpha);
                    let data = [];
                    for(let i=0; i<m; i++) {
                        let M = randGamma(1/a);
                        let u = Math.pow(1 + (-Math.log(Math.random()))/M, -1/a);
                        let v = Math.pow(1 + (-Math.log(Math.random()))/M, -1/a);
                        data.push({u, v});
                    }
                    return data;
                }
            },
            frank: {
                params: [{id: 'alpha', min: 0.1, max: 20, step: 0.1, val: 5.0}],
                gen: (m, p) => {
                    let a = parseFloat(p.alpha);
                    let data = [];
                    for(let i=0; i<m; i++) {
                        let u = Math.random();
                        let t = Math.random();
                        let num = t * (Math.exp(-a) - 1);
                        let den = Math.exp(-a * u) * (1 - t) + t;
                        let v = -1/a * Math.log(1 + num / den);
                        data.push({u, v});
                    }
                    return data;
                }
            },
            gaussian: {
                params: [{id: 'rho', min: -0.95, max: 0.95, step: 0.05, val: 0.7}],
                gen: (m, p) => {
                    let rho = parseFloat(p.rho);
                    let data = [];
                    for(let i=0; i<m; i++) {
                        let z1 = randn();
                        let z2 = rho*z1 + Math.sqrt(1-rho*rho)*randn();
                        data.push({u: stdNormalCDF(z1), v: stdNormalCDF(z2)});
                    }
                    return data;
                }
            },
            t: {
                params: [
                    {id: 'rho', min: -0.95, max: 0.95, step: 0.05, val: 0.5},
                    {id: 'nu', min: 2, max: 20, step: 1, val: 3}
                ],
                gen: (m, p) => {
                    let rho = parseFloat(p.rho);
                    let nu = parseFloat(p.nu);
                    let data = [];
                    for(let i=0; i<m; i++) {
                        let z1 = randn();
                        let z2 = rho*z1 + Math.sqrt(1-rho*rho)*randn();
                        let w = randGamma(nu/2) * 2;
                        let s = Math.sqrt(w/nu);
                        let t1 = z1/s; 
                        let t2 = z2/s;
                        let u = tCDF(t1, nu);
                        let v = tCDF(t2, nu);
                        data.push({u, v});
                    }
                    return data;
                }
            },
            indep: {
                params: [],
                gen: (m, p) => {
                    let data = [];
                    for(let i=0; i<m; i++) data.push({u:Math.random(), v:Math.random()});
                    return data;
                }
            }
        };

        // t-CDF helpers
        function tCDF(x, v) {
            if(v>100) return stdNormalCDF(x);
            let xt = x;
            let prob = 0;
            let z = v / (v + xt*xt);
            let beta = betainc(z, v/2, 0.5);
            if (xt > 0) prob = 1 - 0.5 * beta;
            else prob = 0.5 * beta;
            return prob;
        }
        function betainc(x, a, b) {
            if(x>=(a+1)/(a+b+2)) return 1-betainc(1-x,b,a);
            let lbeta = lngamma(a)+lngamma(b)-lngamma(a+b);
            let front = Math.exp(a*Math.log(x)+b*Math.log(1-x)-lbeta)/a;
            let f=1, C=1, D=0;
            for(let i=1;i<=50;i++){
                let m=Math.floor((i-1)/2), num;
                if(i%2==0) num=m*(b-m)*x/((a+2*m-1)*(a+2*m));
                else num=-(a+m)*(a+b+m)*x/((a+2*m)*(a+2*m+1));
                D=1+num*D; if(Math.abs(D)<1e-30)D=1e-30;
                C=1+num/C; if(Math.abs(C)<1e-30)C=1e-30;
                D=1/D; f*=C*D;
            }
            return front*f;
        }
        function lngamma(z) {
            var c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
            var x=c[0]; for(var i=1;i<c.length;i++)x+=c[i]/(z+i-1);
            var t=z+c.length-1.5; return Math.log(Math.sqrt(2*Math.PI))+Math.log(x)-t+(z-0.5)*Math.log(t);
        }

        // --- App Logic ---
        function updateDistUI(axis) {
            const distType = document.getElementById(`dist_${axis}`).value;
            const container = document.getElementById(`params_${axis}`);
            container.innerHTML = '';
            
            Distributions[distType].params.forEach(p => {
                const div = document.createElement('div');
                div.style.marginBottom = '5px';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; font-size:0.85em; color:#555;">
                        <span>${p.label}</span>
                        <span id="disp_${axis}_${p.id}">${p.val}</span>
                    </div>
                    <input type="range" id="param_${axis}_${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.val}" oninput="updateVal('disp_${axis}_${p.id}', this.value); updateSim();">
                `;
                container.appendChild(div);
            });
        }

        function updateCopulaUI() {
            const type = document.getElementById('copulaType').value;
            const container = document.getElementById('copulaParams');
            container.innerHTML = '';
            Copulas[type].params.forEach(p => {
                const div = document.createElement('div');
                div.className = 'control-group';
                div.innerHTML = `
                    <label>${p.id}</label>
                    <input type="range" id="param_${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.val}" oninput="updateVal('disp_${p.id}', this.value); updateSim();">
                    <div class="value-display">${p.id} = <span id="disp_${p.id}">${p.val}</span></div>
                `;
                container.appendChild(div);
            });
            updateSim();
        }

        function updateVal(id, val) {
            document.getElementById(id).innerText = val;
        }

        function updateSim() {
            const m = 10000;
            const copulaType = document.getElementById('copulaType').value;
            const copulaParams = {};
            Copulas[copulaType].params.forEach(p => {
                copulaParams[p.id] = document.getElementById(`param_${p.id}`).value;
            });
            
            // 1. Generate (u, v)
            const uvData = Copulas[copulaType].gen(m, copulaParams);
            
            // 2. Get Distribution Params
            const distX = document.getElementById('dist_x').value;
            const paramsX = {};
            Distributions[distX].params.forEach(p => {
                paramsX[p.id] = document.getElementById(`param_x_${p.id}`).value;
            });

            const distY = document.getElementById('dist_y').value;
            const paramsY = {};
            Distributions[distY].params.forEach(p => {
                paramsY[p.id] = document.getElementById(`param_y_${p.id}`).value;
            });

            const aggFunc = document.getElementById('aggFunc').value;
            
            // 3. Transform and Compute S
            const S = [];
            for(let p of uvData) {
                let x = invCDF(distX, p.u, paramsX);
                let y = invCDF(distY, p.v, paramsY);
                let val = (aggFunc === 'sum') ? (x + y) : Math.max(x, y);
                S.push(val);
            }
            
            // 4. Stats
            S.sort((a,b) => a-b);
            let idx99 = Math.floor(m * 0.99);
            let var99 = S[idx99];
            
            let sumTail = 0;
            let countTail = 0;
            for(let i=idx99; i<m; i++) {
                sumTail += S[i];
                countTail++;
            }
            let tvar99 = sumTail / countTail;
            
            document.getElementById('val_var').innerText = var99.toFixed(2);
            document.getElementById('val_tvar').innerText = tvar99.toFixed(2);
            
            // 5. Draw Hist
            drawHist(S, var99);
        }

        function drawHist(data, varThreshold) {
            const canvas = document.getElementById('histCanvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width = canvas.offsetWidth;
            const h = canvas.height = canvas.offsetHeight;
            
            ctx.clearRect(0,0,w,h);
            
            // Binning
            const maxVal = data[data.length-1];
            const minVal = data[0];
            const bins = 50;
            // Handle single value case (e.g. if params make it deterministic? Unlikely but possible)
            let binWidth = (maxVal - minVal) / bins;
            if(binWidth <= 0) binWidth = 1;

            const counts = new Array(bins).fill(0);
            let maxCount = 0;
            
            for(let val of data) {
                let idx = Math.floor((val - minVal) / binWidth);
                if(idx >= bins) idx = bins - 1;
                counts[idx]++;
                if(counts[idx] > maxCount) maxCount = counts[idx];
            }
            
            const pad = {l:40, r:20, t:20, b:30};
            const pw = w - pad.l - pad.r;
            const ph = h - pad.t - pad.b;
            
            // Draw Bars
            for(let i=0; i<bins; i++) {
                let binStart = minVal + i * binWidth;
                let binEnd = binStart + binWidth;
                let barH = (counts[i] / maxCount) * ph;
                
                // Color: Red if > VaR, Blue otherwise
                if(binStart >= varThreshold) ctx.fillStyle = '#e74c3c';
                else ctx.fillStyle = '#3498db';
                
                ctx.fillRect(pad.l + (i/bins)*pw, pad.t + ph - barH, (pw/bins)-1, barH);
            }
            
            // VaR Line
            let varX = pad.l + ((varThreshold - minVal)/(maxVal - minVal)) * pw;
            ctx.beginPath();
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 2;
            ctx.setLineDash([5,5]);
            ctx.moveTo(varX, pad.t);
            ctx.lineTo(varX, h - pad.b);
            ctx.stroke();
            ctx.setLineDash([]);
            
            ctx.fillStyle = '#2c3e50';
            ctx.font = '12px sans-serif';
            ctx.fillText(`VaR 99%: ${varThreshold.toFixed(0)}`, varX + 5, pad.t + 20);
            
            // Axes
            ctx.beginPath();
            ctx.strokeStyle = '#333';
            ctx.moveTo(pad.l, pad.t);
            ctx.lineTo(pad.l, h - pad.b);
            ctx.lineTo(w - pad.r, h - pad.b);
            ctx.stroke();
            
            // X Labels
            ctx.textAlign = 'center';
            ctx.fillText(minVal.toFixed(0), pad.l, h - 10);
            ctx.fillText(maxVal.toFixed(0), w - pad.r, h - 10);
            ctx.fillText("Aggregate Loss S", w/2, h - 5);
        }

        // Init
        updateDistUI('x');
        updateDistUI('y');
        updateCopulaUI();
        window.addEventListener('resize', () => updateSim());

    </script>
</body>
</html>
