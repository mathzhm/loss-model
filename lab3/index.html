<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOSS LAB V2 · 损失模型学习舱</title>
<link rel="stylesheet" href="style.css">
<script>
try{
  var t=localStorage.getItem('v2theme');
  if(t) document.documentElement.dataset.theme=t;
}catch(e){}
</script>
<style>
/* ---------- 首页：课程地图 ---------- */
.hero{padding:36px 0 22px}
.hero h1{font-size:30px;font-weight:800}
.hero h1 em{font-style:normal;color:var(--navy2)}
.hero .what{color:var(--ink2);margin-top:8px;max-width:760px}
.hero .what b{color:var(--ink)}
.total-line{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.total-line .big{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 16px;font-size:13.5px;color:var(--ink2)}
.total-line .big b{color:var(--navy2);font-size:18px;margin-right:4px}
.total-line .exp-all{
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  border-radius:11px;padding:8px 16px;font-size:13px;font-weight:600;font-family:inherit;
}
.total-line .exp-all:hover{border-color:var(--navy2)}

/* 阶段带 */
.stage{
  display:grid;grid-template-columns:255px 1fr;gap:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:18px 20px;
}
.stage-l .s-no{font-family:Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--navy2)}
.stage-l .s-name{font-size:16.5px;font-weight:800;margin-top:3px;line-height:1.35;white-space:nowrap}
.stage-l .s-note{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.55;white-space:nowrap}
.chap-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.chap-row.cols4{grid-template-columns:1fr 1fr}
.chap-card{border:1.5px solid var(--line);border-radius:12px;padding:0;background:var(--bg)}
.chap-card .ch-h{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none;border-radius:12px}
.chap-card .ch-h:hover{background:var(--surface2)}
.chap-card .kp-detail{display:none;padding:0 14px 12px}
.chap-card.open .kp-detail{display:block}
.chap-card .chev{margin-left:2px;color:var(--muted);font-size:11px;transition:transform .18s;flex-shrink:0}
.chap-card.open .chev{transform:rotate(90deg);color:var(--navy2)}
.chap-card .ch-h .no{font-family:Consolas,monospace;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px}
.chap-card .ch-h .nm{font-size:13.5px;font-weight:700}
.chap-card .ch-h .cnt{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.kp-pills{display:grid;gap:5px}
.kp-pill{
  display:flex;align-items:center;gap:8px;padding:6.5px 11px;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);
  font-size:13px;color:var(--ink);font-weight:500;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:border-color .13s, transform .13s;
}
.kp-pill:hover{border-color:var(--navy2);transform:translateX(3px)}
.kp-pill .ic{font-size:14px;flex-shrink:0}
.kp-pill .arr{margin-left:auto;color:var(--muted);font-size:12px;opacity:0;transition:opacity .13s}
.kp-pill:hover .arr{opacity:1}

/* 阶段之间的连接箭头 */
/* 官方大纲对照带 */
.band-wrap{margin-top:34px}
.band-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.band-head h2{font-size:18px;font-weight:800}
.band-head .hint{font-size:12.5px;color:var(--muted)}
.band{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:11px}
@media(max-width:760px){.band{grid-template-columns:1fr}}
.tcard{padding:14px 16px}
.tcard .t-top{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.tcard .t-no{font-family:Consolas,monospace;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px;background:var(--navy2)}
.tcard .t-name{font-size:13.5px;font-weight:700}
.tcard .t-w{margin-left:auto;font-size:11px;font-weight:800;color:var(--navy2);background:var(--surface2);border-radius:7px;padding:2.5px 8px;white-space:nowrap}
.tcard .t-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);padding:3.5px 0;flex-wrap:wrap}
.tcard .t-row .code{font-family:Consolas,monospace;font-size:10.5px;font-weight:700;color:var(--ink2);background:var(--surface2);border-radius:5px;padding:1px 6px}
.tcard .t-row a{color:var(--navy2);font-weight:600;border-bottom:1px dashed transparent}
.tcard .t-row a:hover{border-bottom-color:var(--navy2)}
.foot-note{margin-top:12px;font-size:12px;color:var(--muted)}

.bridge{display:flex;align-items:center;gap:12px;padding:8px 0 8px 44px;color:var(--muted)}
.bridge .dn{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--navy2);color:#fff;font-size:15px;font-weight:700;
  box-shadow:var(--shadow);
}
html[data-theme="dark"] .bridge .dn{color:#0E1626}
.bridge .b-note{font-size:12.5px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:5px 13px}
@media(max-width:900px){
  .stage{grid-template-columns:1fr}
  .stage-l .s-name,.stage-l .s-note{white-space:normal}
}
@media(max-width:760px){
  .chap-row,.chap-row.cols4{grid-template-columns:1fr}
  .bridge{padding-left:12px}
}
</style>
</head>
<body>

<script src="nav.js"></script>

<main class="wrap">
  <div class="hero">
    <h1>损失模型 · CS2 <em>互动学习舱</em></h1>
    <p class="what" id="what"></p>
    <div class="total-line" id="totalLine"></div>
  </div>

  <div id="map"></div>

  <div class="band-wrap" id="syllabus">
    <div class="band-head">
      <h2>IFoA 官方大纲对照</h2>
      <span class="hint">主题编号与考试权重 · 点击章节号可跳到框架对应位置</span>
    </div>
    <div class="band" id="band"></div>
    <div class="foot-note">注：Ch22 模拟方法为教师补充内容，不属于 ACTED 考纲。</div>
  </div>

  <div class="foot">LOSS LAB · 英国精算师 IFoA CS2 · Risk Modelling &amp; Survival Analysis</div>
</main>

<script src="course.js"></script>
<script>
/* ---------- 课程地图：四个阶段，按学习路径排列 ---------- */
const chOf = id => COURSE.chapters.find(c=>c.id===id);
const STAGES = [
  {no:'STAGE 1', name:'打地基：看懂数据的走向', note:'建模前先读懂时间序列的规律与平稳性', chs:[13,14]},
  {no:'STAGE 2', name:'建模单笔损失', note:'一笔赔款服从什么分布？极端尾部怎么刻画？', chs:[15,16]},
  {no:'STAGE 3', name:'从单笔到风险组合', note:'多笔损失如何联动、加总、再分工（再保险）', chs:[17,18,19,20]},
  {no:'STAGE 4', name:'现代工具箱', note:'用模拟与机器学习完成整条建模链', chs:[21,22]},
];
const BRIDGES = [
  '有了「分布」，才能谈多笔损失怎么联动 →',
  '先懂单笔，才能懂组合：相依、聚合与再保 →',
  '最后用模拟和机器学习把整条链跑起来 →',
];

const nKp = COURSE.chapters.reduce((s,c)=>s+c.kps.length,0);
const PROG = V2.prog();
document.getElementById('what').innerHTML =
  '<b>这门课学什么：</b>精算师如何为「不确定的损失」建模——从时间序列、损失分布，到 Copula 相依、再保险与机器学习。';
document.getElementById('totalLine').innerHTML =
  `<span class="big"><b>${COURSE.chapters.length}</b>章</span>`+
  `<span class="big"><b>${nKp}</b>个知识点</span>`+
  `<span class="big"><b>52</b>段讲解视频</span>`+
  `<span class="big"><b>${nKp}</b>个互动演示</span>`+
  `<span style="font-size:12.5px;color:var(--muted)">按下面四步路线走，点任意知识点开始</span>`+
  `<button class="exp-all" id="expAll">全部展开 ▾</button>`;

/* 章节默认收起，点标题展开；「全部展开」切换 */
/* 每章官方大纲目标编号 */
const OBJ = {13:'主题 2', 14:'主题 2', 15:'1.1', 16:'1.4', 17:'1.3', 18:'1.1', 19:'1.2', 20:'1.2', 21:'5.1', 22:'教师补充'};

document.getElementById('map').innerHTML = STAGES.map((st,si)=>`
  <section class="stage">
    <div class="stage-l">
      <div class="s-no">${st.no}</div>
      <div class="s-name">${st.name}</div>
      <div class="s-note">${st.note}</div>
    </div>
    <div class="chap-row${st.chs.length>2?' cols4':''}">
      ${st.chs.map(id=>{const c=chOf(id);return `
        <div class="chap-card" id="ch${c.id}">
          <div class="ch-h" onclick="this.parentElement.classList.toggle('open')">
            <span class="no" style="background:${c.color}">${c.no}</span>
            <span class="nm">${c.icon} ${c.name}</span>
            <span class="cnt">${OBJ[c.id]||c.kps.length+' 点'} · ${(()=>{const done=c.kps.filter(k=>PROG[k.id]&&(PROG[k.id].s!=null||PROG[k.id].v)).length;return done?`${done}/${c.kps.length} 已学`:`${c.kps.length} 点`;})()}</span>
            <span class="chev">▶</span>
          </div>
          <div class="kp-detail">
          <div class="kp-pills">
            ${c.kps.map(k=>`
              <a class="kp-pill" href="learn.html?ch=${c.id}&kp=${k.id}" title="${k.name}">
                <span class="ic">${k.icon||'📘'}</span>${k.name}<span class="arr">→</span>
              </a>`).join('')}
          </div>
          </div>
        </div>`;}).join('')}
    </div>
  </section>
  ${si<STAGES.length-1?`<div class="bridge"><span class="dn">↓</span><span class="b-note">${BRIDGES[si]}</span></div>`:''}
`).join('');

document.getElementById('expAll').addEventListener('click',function(){
  const cards=[...document.querySelectorAll('.chap-card')];
  const openAll=cards.some(c=>!c.classList.contains('open'));
  cards.forEach(c=>c.classList.toggle('open',openAll));
  this.textContent = openAll?'全部收起 ▴':'全部展开 ▾';
});

/* ---------- 官方大纲对照带 ---------- */
const THEMES = [
  {no:'主题 1', name:'随机变量与风险建模分布', w:'20%', rows:[
    ['1.1','损失分布（含/不含风险分担）',[15,18]],
    ['1.2','复合分布及其应用',[19,20]],
    ['1.3','Copula 入门',[17]],
    ['1.4','极值理论入门',[16]],
  ]},
  {no:'主题 2', name:'时间序列', w:'20%', rows:[
    ['2.1','时间序列模型的概念',[13,14]],
    ['2.2','时间序列模型的应用',[13,14]],
  ]},
  {no:'主题 5', name:'机器学习', w:'10%', rows:[
    ['5.1','机器学习基本原理',[21]],
  ]},
];
document.getElementById('band').innerHTML = THEMES.map(t=>`
  <div class="card tcard">
    <div class="t-top"><span class="t-no">${t.no}</span><span class="t-name">${t.name}</span><span class="t-w">${t.w}</span></div>
    ${t.rows.map(([code,lab,chs])=>`
      <div class="t-row"><span class="code">${code}</span>${lab}<span style="margin-left:auto;display:flex;gap:4px">${chs.map(id=>{const c=chOf(id);return `<a href="#ch${id}" title="${c.no} ${c.name}">${c.no}</a>`;}).join('')}</span></div>`).join('')}
  </div>`).join('');
</script>
</body>
</html>
