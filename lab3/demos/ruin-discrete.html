<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离散时间盈余路径与破产事件模拟</title>
    <script src="vendor/plotly.min.js"></script>
    
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            min-height: 600px;
        }

        .sidebar {
            width: 350px;
            background: #f8f9fa;
            border-right: 1px solid #e9ecef;
            padding: 20px;
        }

        .content-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .theory-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #ff6b6b;
        }

        .theory-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .formula {
            background: white;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border: 1px solid #e9ecef;
            margin: 10px 0;
            text-align: center;
        }

        .parameters {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .parameter-group {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .parameter-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }

        .parameter-group input, .parameter-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        .parameter-group input:focus, .parameter-group select:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 0 2px rgba(255, 107, 107, 0.2);
        }

        .simulate-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 20px 0;
            transition: all 0.3s ease;
            width: 100%;
        }

        .simulate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .plot-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .result-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            text-align: center;
        }

        .result-item .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 5px;
        }

        .result-item .label {
            color: #6c757d;
            font-size: 0.9em;
        }

        .info-box {
            background: #e3f2fd;
            border: 1px solid #2196f3;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }

        .info-box h4 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            color: #6c757d;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #ff6b6b;
            border-bottom-color: #ff6b6b;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>离散时间盈余路径与破产事件模拟</h1>
            <p>基于盈余过程 U(t) = u + c·t - S(t) 的数值模拟与破产概率分析</p>
        </div>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="theory-section">
                    <h3>理论基础</h3>
                    <div class="formula">
                        <strong>盈余过程:</strong><br>
                        $$U(t) = u + c \cdot t - S(t)$$
                    </div>
                    <div class="info-box">
                        <h4>参数说明</h4>
                        <p><strong>u:</strong> 初始准备金</p>
                        <p><strong>c:</strong> 每期保费收入</p>
                        <p><strong>S(t):</strong> 总索赔额</p>
                    </div>
                    <div class="formula">
                        <strong>破产概率:</strong><br>
                        $$\psi(u) = \Pr\left(\inf_{t \geq 0} U(t) < 0\right)$$
                    </div>
                </div>

                <div class="parameters">
                    <div class="parameter-group">
                        <label for="initial-reserve">初始准备金 (u):</label>
                        <input type="number" id="initial-reserve" value="100" step="10" min="0">
                    </div>
                    
                    <div class="parameter-group">
                        <label for="premium-rate">保费率 (c):</label>
                        <input type="number" id="premium-rate" value="30" step="1" min="1">
                    </div>
                    
                    <div class="parameter-group">
                        <label for="claim-frequency">索赔频率 (λ):</label>
                        <input type="number" id="claim-frequency" value="20" step="1" min="1">
                    </div>
                    
                    <div class="parameter-group">
                        <label for="claim-distribution">索赔分布:</label>
                        <select id="claim-distribution">
                            <option value="exponential">指数分布</option>
                            <option value="gamma">伽马分布</option>
                            <option value="lognormal">对数正态分布</option>
                        </select>
                    </div>
                    
                    <div class="parameter-group">
                        <label for="claim-param1">分布参数1:</label>
                        <input type="number" id="claim-param1" value="1" step="0.1" min="0.1">
                    </div>
                    
                    <div class="parameter-group">
                        <label for="claim-param2">分布参数2:</label>
                        <input type="number" id="claim-param2" value="1" step="0.1" min="0.1">
                    </div>
                    
                    <div class="parameter-group">
                        <label for="time-horizon">时间范围:</label>
                        <input type="number" id="time-horizon" value="50" step="5" min="10">
                    </div>
                    
                    <div class="parameter-group">
                        <label for="num-simulations">模拟次数:</label>
                        <input type="number" id="num-simulations" value="1000" step="100" min="100">
                    </div>
                </div>

                <button class="simulate-btn" onclick="runSimulation()">开始模拟</button>
                
                <div class="results" id="results">
                    <!-- 结果将在这里显示 -->
                </div>
            </div>
            
            <div class="content-area">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('paths')">盈余路径</button>
                    <button class="tab" onclick="switchTab('distribution')">破产时间分布</button>
                    <button class="tab" onclick="switchTab('analysis')">统计分析</button>
                </div>
                
                <div class="tab-content active" id="paths-content">
                    <div class="plot-container">
                        <div id="surplus-paths-plot"></div>
                    </div>
                </div>
                
                <div class="tab-content" id="distribution-content">
                    <div class="plot-container">
                        <div id="ruin-time-plot"></div>
                    </div>
                </div>
                
                <div class="tab-content" id="analysis-content">
                    <div class="plot-container">
                        <div id="analysis-plot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="ruin_simulation.js"></script>
  <script src="vendor/mathjax-loader.js"></script>
  <script src="vendor/mathjax-tex-svg.js"></script>
</body>
</html>
